<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator - Free Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  .back-link {
    display: block;
    text-align: left;
    margin-bottom: 15px;
    color: #3a7d1f;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
  }
  h1 {
    color: #3a7d1f;
    font-size: 24px;
    margin-bottom: 5px;
  }
  p.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }
  label {
    display: block;
    text-align: left;
    font-size: 13px;
    color: #666;
    margin-bottom: 4px;
    margin-top: 10px;
  }
  input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 8px;
    border: 2px solid #d9f0c4;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #56ab2f; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: #56ab2f;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { background: #43861f; }
  #result {
    margin-top: 25px;
    display: none;
  }
  .bmi-number {
    font-size: 48px;
    font-weight: bold;
    color: #3a7d1f;
  }
  .bmi-category {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    margin-top: 8px;
    margin-bottom: 15px;
  }
  .cat-underweight { background: #fff3cd; color: #856404; }
  .cat-normal { background: #d4edda; color: #155724; }
  .cat-overweight { background: #ffe5b4; color: #a05a00; }
  .cat-obese { background: #f8d7da; color: #721c24; }
  .range-info {
    background: #f4faee;
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 13px;
    color: #555;
    text-align: left;
  }
  .range-info div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">&larr; Home</a>
  <h1>⚖️ BMI Calculator</h1>
  <p class="subtitle">Apna Body Mass Index nikalo</p>

  <label>Height (cm)</label>
  <input type="number" id="height" placeholder="Jaise 170">

  <label>Weight (kg)</label>
  <input type="number" id="weight" placeholder="Jaise 65">

  <button onclick="calculateBMI()">BMI Nikaalo 📊</button>

  <div id="result">
    <div class="bmi-number" id="bmiValue">0</div>
    <div class="bmi-category" id="bmiCategory">-</div>
    <div class="range-info">
      <div><span>Underweight</span><span>&lt; 18.5</span></div>
      <div><span>Normal</span><span>18.5 - 24.9</span></div>
      <div><span>Overweight</span><span>25 - 29.9</span></div>
      <div><span>Obese</span><span>30+</span></div>
    </div>
  </div>
</div>

<script>
function calculateBMI() {
  const height = parseFloat(document.getElementById('height').value);
  const weight = parseFloat(document.getElementById('weight').value);

  if (!height || !weight || height <= 0 || weight <= 0) {
    alert("Height aur weight sahi se daalo!");
    return;
  }

  const heightM = height / 100;
  const bmi = weight / (heightM * heightM);
  const bmiRounded = bmi.toFixed(1);

  let category = "";
  let catClass = "";

  if (bmi < 18.5) {
    category = "Underweight";
    catClass = "cat-underweight";
  } else if (bmi < 25) {
    category = "Normal";
    catClass = "cat-normal";
  } else if (bmi < 30) {
    category = "Overweight";
    catClass = "cat-overweight";
  } else {
    category = "Obese";
    catClass = "cat-obese";
  }

  document.getElementById('result').style.display = 'block';
  document.getElementById('bmiValue').textContent = bmiRounded;
  const catEl = document.getElementById('bmiCategory');
  catEl.textContent = category;
  catEl.className = 'bmi-category ' + catClass;
}
</script>

</body>
</html>
