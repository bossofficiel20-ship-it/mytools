<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - Free Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
  }
  h1 {
    color: #5a3d9c;
    font-size: 24px;
    margin-bottom: 5px;
  }
  p.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }
  .password-box {
    background: #f3f0fb;
    border: 2px solid #d8cdf0;
    border-radius: 10px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    word-break: break-all;
    margin-bottom: 20px;
    min-height: 30px;
    letter-spacing: 1px;
  }
  .options {
    text-align: left;
    margin-bottom: 20px;
  }
  .option-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 15px;
    color: #444;
  }
  .length-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 15px;
    color: #444;
  }
  input[type="range"] {
    width: 55%;
  }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
  }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #764ba2;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { background: #5a3d9c; }
  .copy-btn {
    background: #28a745;
    margin-top: 8px;
  }
  .copy-btn:active { background: #1e7e34; }
  #copiedMsg {
    color: #28a745;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .back-link {
    display: block;
    text-align: left;
    margin-bottom: 15px;
    color: #764ba2;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">&larr; Home</a>
  <h1>🔐 Password Generator</h1>
  <p class="subtitle">Strong aur secure password banao</p>

  <div class="password-box" id="passwordBox">Click Generate</div>

  <div class="options">
    <div class="length-row">
      <span>Length: <b id="lengthValue">12</b></span>
      <input type="range" id="lengthSlider" min="6" max="24" value="12">
    </div>
    <div class="option-row">
      <span>Numbers (0-9)</span>
      <input type="checkbox" id="numbers" checked>
    </div>
    <div class="option-row">
      <span>Symbols (!@#$%)</span>
      <input type="checkbox" id="symbols" checked>
    </div>
    <div class="option-row">
      <span>Uppercase (ABC)</span>
      <input type="checkbox" id="uppercase" checked>
    </div>
  </div>

  <button onclick="generatePassword()">Generate Karo 🔄</button>
  <button class="copy-btn" onclick="copyPassword()">Copy Karo 📋</button>
  <div id="copiedMsg">Copied! ✅</div>
</div>

<script>
const lengthSlider = document.getElementById('lengthSlider');
const lengthValue = document.getElementById('lengthValue');

lengthSlider.addEventListener('input', () => {
  lengthValue.textContent = lengthSlider.value;
});

function generatePassword() {
  const length = parseInt(lengthSlider.value);
  const useNumbers = document.getElementById('numbers').checked;
  const useSymbols = document.getElementById('symbols').checked;
  const useUppercase = document.getElementById('uppercase').checked;

  let chars = "abcdefghijklmnopqrstuvwxyz";
  if (useUppercase) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if (useNumbers) chars += "0123456789";
  if (useSymbols) chars += "!@#$%^&*()_+-=";

  let password = "";
  for (let i = 0; i < length; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  document.getElementById('passwordBox').textContent = password;
  document.getElementById('copiedMsg').style.display = 'none';
}

function copyPassword() {
  const text = document.getElementById('passwordBox').textContent;
  if (text === "Click Generate") {
    alert("Pehle password generate karo!");
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copiedMsg').style.display = 'block';
  });
}
</script>

</body>
</html>
