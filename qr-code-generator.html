<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - Free Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #232526 0%, #414345 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
  }
  .back-link {
    display: block;
    text-align: left;
    margin-bottom: 15px;
    color: #333;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
  }
  h1 {
    color: #222;
    font-size: 24px;
    margin-bottom: 5px;
  }
  p.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }
  input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 10px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #414345; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: #232526;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { background: #000; }
  #qrResult {
    margin-top: 25px;
    display: none;
  }
  #qrcode {
    display: flex;
    justify-content: center;
    padding: 15px;
    background: #f9f9f9;
    border-radius: 12px;
  }
  .download-btn {
    background: #28a745;
    margin-top: 12px;
  }
  .download-btn:active { background: #1e7e34; }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">&larr; Home</a>
  <h1>📱 QR Code Generator</h1>
  <p class="subtitle">Text ya link se QR code banao</p>

  <input type="text" id="qrText" placeholder="Link ya text daalo yahan">

  <button onclick="generateQR()">QR Banao ✨</button>

  <div id="qrResult">
    <div id="qrcode"></div>
    <button class="download-btn" onclick="downloadQR()">Download Karo ⬇️</button>
  </div>
</div>

<script>
let qr;

function generateQR() {
  const text = document.getElementById('qrText').value.trim();
  if (text === "") {
    alert("Pehle kuch text ya link daalo!");
    return;
  }

  document.getElementById('qrcode').innerHTML = "";
  document.getElementById('qrResult').style.display = 'block';

  qr = new QRCode(document.getElementById('qrcode'), {
    text: text,
    width: 200,
    height: 200,
    colorDark: "#000000",
    colorLight: "#ffffff",
  });
}

function downloadQR() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) {
    alert("Pehle QR code banao!");
    return;
  }
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
