<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Calculator - Free Fun Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  .back-link {
    display: block;
    text-align: left;
    margin-bottom: 15px;
    color: #ff4b6e;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
  }
  h1 {
    color: #ff4b6e;
    font-size: 26px;
    margin-bottom: 5px;
  }
  p.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
  }
  input {
    width: 100%;
    padding: 12px 15px;
    margin: 8px 0;
    border: 2px solid #ffd6e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #ff4b6e; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: #ff4b6e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { background: #e63e5f; }
  #result {
    margin-top: 25px;
    display: none;
  }
  .percentage {
    font-size: 48px;
    font-weight: bold;
    color: #ff4b6e;
  }
  .message {
    font-size: 15px;
    color: #555;
    margin-top: 10px;
  }
  .heart-bar {
    width: 100%;
    height: 20px;
    background: #ffe0e6;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
  }
  .heart-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff758c, #ff4b6e);
    width: 0%;
    transition: width 1s ease;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">&larr; Home</a>
  <h1>💕 Love Calculator</h1>
  <p class="subtitle">Apna aur partner ka naam daalo</p>

  <input type="text" id="name1" placeholder="Tumhara naam">
  <input type="text" id="name2" placeholder="Partner ka naam">

  <button onclick="calculateLove()">Calculate Karo ❤️</button>

  <div id="result">
    <div class="percentage" id="percentValue">0%</div>
    <div class="heart-bar">
      <div class="heart-fill" id="heartFill"></div>
    </div>
    <div class="message" id="loveMessage"></div>
  </div>
</div>

<script>
function calculateLove() {
  const name1 = document.getElementById('name1').value.trim();
  const name2 = document.getElementById('name2').value.trim();

  if (name1 === "" || name2 === "") {
    alert("Dono naam daalo pehle!");
    return;
  }

  const combined = (name1 + name2).toLowerCase();
  let hash = 0;
  for (let i = 0; i < combined.length; i++) {
    hash = combined.charCodeAt(i) + ((hash << 5) - hash);
  }
  let percent = Math.abs(hash) % 51 + 45;
  if (percent > 100) percent = 100;

  document.getElementById('result').style.display = 'block';
  document.getElementById('percentValue').textContent = percent + '%';

  setTimeout(() => {
    document.getElementById('heartFill').style.width = percent + '%';
  }, 100);

  let message = "";
  if (percent >= 90) message = "Wah! Ye to made for each other jodi hai! 💞";
  else if (percent >= 75) message = "Bahut achha match hai, chances bright hain! 💗";
  else if (percent >= 60) message = "Achha connection hai, aur try karo! 💕";
  else message = "Thoda kaam karna padega dosti pe! 😅";

  document.getElementById('loveMessage').textContent = message;
}
</script>

</body>
</html>
